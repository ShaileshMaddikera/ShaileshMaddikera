="#4a4a50">Hand-built with plain HTML, CSS and JavaScript. No frameworks.</text><text x="1280" y="173" font-family="'Geist Mono'" font-weight="400" font-size="16" fill="#85858c" text-anchor="end" letter-spacing="0.04em">PERSONAL</text><rect x="0" y="234" width="1280" height="1" fill="#e4e2dc"/><text x="0" y="286" font-family="'Geist Mono'" font-weight="400" font-size="17" fill="#85858c" letter-spacing="0.04em">AUG 2026</text><text x="200" y="286" font-family="'Geist'" font-weight="500" font-size="34" fill="#111113" letter-spacing="-0.03em">Surety.ai</text><text x="200" y="322" font-family="'Geist'" font-weight="400" font-size="21" fill="#4a4a50">Generator vs. Checker, server-validated citations, full audit record.</text><text x="1280" y="285" font-family="'Geist Mono'" font-weight="400" font-size="16" fill="#85858c" text-anchor="end" letter-spacing="0.04em">AI SYSTEMS</text><rect x="0" y="346" width="1280" height="1" fill="#e4e2dc"/><text x="0" y="398" font-family="'Geist Mono'" font-weight="400" font-size="17" fill="#85858c" letter-spacing="0.04em">JUN 2025</text><text x="200" y="398" font-family="'Geist'" font-weight="500" font-size="34" fill="#111113" letter-spacing="-0.03em">MyGeneticMenu</text><text x="200" y="434" font-family="'Geist'" font-weight="400" font-size="21" fill="#4a4a50">Genetic data into personalized diet plans with Gemini.</text><text x="1280" y="397" font-family="'Geist Mono'" font-weight="400" font-size="16" fill="#85858c" text-anchor="end" letter-spacing="0.04em">HEALTH · AI</text><rect x="0" y="458" width="1280" height="1" fill="#e4e2dc"/><text x="0" y="510" font-family="'Geist Mono'" font-weight="400" font-size="17" fill="#85858c" letter-spacing="0.04em">MAR 2025</text><text x="200" y="510" font-family="'Geist'" font-weight="500" font-size="34" fill="#111113" letter-spacing="-0.03em">Trackmania RL driver</text><text x="200" y="546" font-family="'Geist'" font-weight="400" font-size="21" fill="#4a4a50">Soft Actor-Critic in PyTorch, driving fro