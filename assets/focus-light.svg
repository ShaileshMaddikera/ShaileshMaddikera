<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="516" viewBox="0 0 1280 516" role="img" aria-label="What I work on: AI agents &amp; LLM systems; Native Apple apps; Full-stack &amp; infrastructure; Hardware &amp; wearables"><title>What I work on: AI agents &amp; LLM systems; Native Apple apps; Full-stack &amp; infrastructure; Hardware &amp; wearables</title><style>@font-face{font-family:'Geist Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Geist';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Geist';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="631" height="249" rx="22" fill="#ffffff" stroke="#e4e2dc"/><text x="28" y="46" font-family="'Geist Mono'" font-weight="400" font-size="17" fill="#3d6a00">01</text><text x="28" y="94" font-family="'Geist'" font-weight="600" font-size="32" fill="#111113" letter-spacing="-0.035em">AI agents &amp; LLM systems</text><text x="28" y="134" font-family="'Geist'" font-weight="400" font-size="20" fill="#4a4a50">Multi-model systems that check each other’s work,</text><text x="28" y="162" font-family="'Geist'" font-weight="400" font-size="20" fill="#4a4a50">real-time voice and vision agents, grounded answers.</text><text x="28" y="218" font-family="'Geist Mono'" font-weight="400" font-size="15" fill="#85858c" letter-spacing="0.05em">GEMINI · LIVEKIT · FASTAPI · PYTORCH</text><rect x="648.5" y="0.5" width="631" height="249" rx="22" fill="#ffffff" stroke="#e4e2dc"/><text x="676" y="46" font-family="'Geist Mono'" font-weight="400" font-size="17" fill="#3d6a00">02</text><text x="676" y="94" font-family="'Geist'" font-weight="600" font-size="32" fill="#111113" letter-spacing="-0.035em">Native Apple apps</text><text x="676" y="134" font-family="'Geist'" font-weight="400" font-size="20" fill="#4a4a50">Swift 6 and SwiftUI for iPhone, iPad and Mac, with</text><text x="676" y="162" font-family="'Geist'" font-weight="400" font-size="20" fill="#4a4a50">on-device Vision and Apple Intelligence, fully tested.</text><text x="676" y="218" font-family="'Geist Mono'" font-weight="400" font-size="15" fill="#85858c" letter-spacing="0.05em">SWIFT 6 · SWIFTUI · VISION · XCTEST</text><rect x="0.5" y="266.5" width="631" height="249" rx="22" fill="#ffffff" stroke="#e4e2dc"/><text x="28" y="312" font-family="'Geist Mono'" font-weight="400" font-size="17" fill="#3d6a00">03</text><text x="28" y="360" font-family="'Geist'" font-weight="600" font-size="32" fill="#111113" letter-spacing="-0.035em">Full-stack &amp; infrastructure</text><text x="28" y="400" font-family="'Geist'" font-weight="400" font-size="20" fill="#4a4a50">TypeScript and Python backends, edge databases, data</text><text x="28" y="428" font-family="'Geist'" font-weight="400" font-size="20" fill="#4a4a50">pipelines and end-to-end tests that run in production.</text><text x="28" y="484" font-family="'Geist Mono'" font-weight="400" font-size="15" fill="#85858c" letter-spacing="0.05em">NEXT.JS · TYPESCRIPT · TURSO · VERCEL</text><rect x="648.5" y="266.5" width="631" height="249" rx="22" fill="#ffffff" stroke="#e4e2dc"/><text x="676" y="312" font-family="'Geist Mono'" font-weight="400" font-size="17" fill="#3d6a00">04</text><text x="676" y="360" font-family="'Geist'" font-weight="600" font-size="32" fill="#111113" letter-spacing="-0.035em">Hardware &amp; wearables</text><text x="676" y="400" font-family="'Geist'" font-weight="400" font-size="20" fill="#4a4a50">On-device perception and early work on taking AI</text><text x="676" y="428" font-family="'Geist'" font-weight="400" font-size="20" fill="#4a4a50">off the phone and onto purpose-built hardware.</text><text x="676" y="484" font-family="'Geist Mono'" font-weight="400" font-size="15" fill="#85858c" letter-spacing="0.05em">ON-DEVICE ML · COMPUTER VISION · REAL-TIME MEDIA</text></svg>